# Deux modes de deploiement :
#   1. Images GHCR (defaut) : docker compose -f docker-compose.prod.yml up -d
#      Utilise les images pre-buildees depuis GitHub Container Registry.
#   2. Build local : docker compose -f docker-compose.prod.yml up -d --build
#      Construit les images localement a partir des Dockerfiles du projet.

services:
  # Base de donnees PostgreSQL avec PostGIS
  db:
    image: postgis/postgis:17-3.5-alpine
    container_name: cicada_prod_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=fr_FR.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - cicada_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Cache Redis
  redis:
    image: redis:7-alpine
    container_name: cicada_prod_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    networks:
      - cicada_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Backend Django (gunicorn)
  web:
    image: ghcr.io/rnf-si/cicada-backend:${CICADA_VERSION:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: cicada_prod_web
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - EMAIL_BACKEND=${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-true}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-noreply@cicada.fr}
      - SITE_URL=${SITE_URL:-http://localhost:4200}
      # --- Exploration federee (#636) ---
      # Vide par defaut : sans ces variables l'instance ne publie rien et sert
      # son exploration depuis son propre index, comme avant.
      # CICADA_INSTANCE_ID est IMMUABLE : il s'ecrit dans chaque ligne d'index,
      # le changer perime tout ce qui a ete publie sous l'ancienne valeur.
      - CICADA_INSTANCE_ID=${CICADA_INSTANCE_ID:-}
      - CICADA_INSTANCE_LABEL=${CICADA_INSTANCE_LABEL:-}
      - CICADA_PUBLIC_URL=${CICADA_PUBLIC_URL:-}
      - CICADA_HUB_URL=${CICADA_HUB_URL:-}
      - CICADA_HUB_PUSH_TOKEN=${CICADA_HUB_PUSH_TOKEN:-}
      - CICADA_HUB_READ_TOKEN=${CICADA_HUB_READ_TOKEN:-}
      - CICADA_EXPLORATION_SOURCE=${CICADA_EXPLORATION_SOURCE:-local}
      - CICADA_HUB_PUSH_AUTO=${CICADA_HUB_PUSH_AUTO:-true}
    volumes:
      - media_files:/app/media
      - static_files:/app/static
      # #384 — bind-mount des logs sur l'hôte (/var/log/cicada) pour consultation
      # directe sur le serveur (conteneur=root, dossier hôte créé par le postinst).
      - /var/log/cicada:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cicada_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # Frontend Angular (Apache)
  frontend:
    image: ghcr.io/rnf-si/cicada-frontend:${CICADA_VERSION:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cicada_prod_frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      web:
        condition: service_healthy
    networks:
      - cicada_network
    restart: unless-stopped

  # Celery Worker
  celery-worker:
    image: ghcr.io/rnf-si/cicada-backend:${CICADA_VERSION:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: cicada_prod_celery_worker
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - EMAIL_BACKEND=${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-true}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-noreply@cicada.fr}
      - SITE_URL=${SITE_URL:-http://localhost:4200}
      # --- Exploration federee (#636) ---
      # C'est le worker qui execute la publication nocturne : sans ces
      # variables, la tache planifiee se terminerait en « non configuree »
      # alors meme que le conteneur web, lui, est branche sur le hub.
      - CICADA_INSTANCE_ID=${CICADA_INSTANCE_ID:-}
      - CICADA_INSTANCE_LABEL=${CICADA_INSTANCE_LABEL:-}
      - CICADA_PUBLIC_URL=${CICADA_PUBLIC_URL:-}
      - CICADA_HUB_URL=${CICADA_HUB_URL:-}
      - CICADA_HUB_PUSH_TOKEN=${CICADA_HUB_PUSH_TOKEN:-}
      - CICADA_HUB_READ_TOKEN=${CICADA_HUB_READ_TOKEN:-}
      - CICADA_EXPLORATION_SOURCE=${CICADA_EXPLORATION_SOURCE:-local}
      - CICADA_HUB_PUSH_AUTO=${CICADA_HUB_PUSH_AUTO:-true}
    volumes:
      - media_files:/app/media
      # #384 — bind-mount des logs sur l'hôte (/var/log/cicada) pour consultation
      # directe sur le serveur (conteneur=root, dossier hôte créé par le postinst).
      - /var/log/cicada:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - cicada_network
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    restart: unless-stopped

  # Celery Beat
  celery-beat:
    image: ghcr.io/rnf-si/cicada-backend:${CICADA_VERSION:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: cicada_prod_celery_beat
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
      - DJANGO_SETTINGS_MODULE=config.settings.production
    volumes:
      # #384 — bind-mount des logs sur l'hôte (/var/log/cicada) pour consultation
      # directe sur le serveur (conteneur=root, dossier hôte créé par le postinst).
      - /var/log/cicada:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - cicada_network
    command: ["celery", "-A", "config", "beat", "-l", "info"]
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  media_files:
    driver: local
  static_files:
    driver: local
  logs_data:
    driver: local

networks:
  cicada_network:
    driver: bridge
