# Mises à jour de sécurité et de version des dépendances (lot 9 du plan
# sécurité, novembre 2026). Les SBOM restent envoyés à Dependency-Track au tag.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /hub
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
  - package-ecosystem: pip
    directory: /tracking-api
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /frontend
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
