name: Docker Build & Push

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/rnf-si/cicada-backend
  FRONTEND_IMAGE: ghcr.io/rnf-si/cicada-frontend
  HUB_IMAGE: ghcr.io/rnf-si/cicada-hub

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          # #646 — la version affichée dans l'administration est celle du tag
          build-args: |
            CICADA_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # Hub d'exploration fédérée (#636). Contexte = racine du dépôt, et non
      # ./hub : l'image embarque les référentiels nationaux versionnés dans
      # backend/ (ref_geo, nomenclatures), qui doivent être les mêmes fichiers
      # que ceux des instances. Le .dockerignore de la racine limite ce qui est
      # envoyé au daemon.
      - name: Build and push hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./hub/Dockerfile.prod
          push: true
          build-args: |
            CICADA_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.HUB_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.HUB_IMAGE }}:latest
          cache-from: type=gha,scope=hub
          cache-to: type=gha,mode=max,scope=hub
