name: Docker Build & Push

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/rnf-si/cicada-backend
  FRONTEND_IMAGE: ghcr.io/rnf-si/cicada-frontend
  HUB_IMAGE: ghcr.io/rnf-si/cicada-hub

# Jeton du dépôt en lecture seule par défaut (un job qui doit écrire le
# déclare lui-même).
permissions:
  contents: read

jobs:
  # Les images d'un tag ne partent que si les tests passent sur ce commit.
  tests:
    uses: ./.github/workflows/tests.yml

  build-and-push:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Le nom du tag n'est jamais inséré dans un script : lu par variable
      # d'environnement, et refusé s'il n'est pas un numéro de version.
      - name: Extract version from tag
        id: version
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag invalide : $GITHUB_REF_NAME"; exit 1; }
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build and push backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          # #646 — la version affichée dans l'administration est celle du tag
          build-args: |
            CICADA_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.BACKEND_IMAGE }}:latest
          # Image de release construite sans cache partagé (empoisonnement).
          no-cache: true

      # Frontend : contexte = racine du dépôt, parce que l'image embarque aussi
      # la documentation (documentation/ → /aide/). Les exclusions sont dans
      # frontend/Dockerfile.dockerignore (BuildKit), pas dans le .dockerignore racine.
      - name: Build and push frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.FRONTEND_IMAGE }}:latest
          # Image de release construite sans cache partagé (empoisonnement).
          no-cache: true

      # Hub d'exploration fédérée (#636). Contexte = racine du dépôt, et non
      # ./hub : l'image embarque les référentiels nationaux versionnés dans
      # backend/ (ref_geo, nomenclatures), qui doivent être les mêmes fichiers
      # que ceux des instances. Le .dockerignore de la racine limite ce qui est
      # envoyé au daemon.
      - name: Build and push hub
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: ./hub/Dockerfile.prod
          push: true
          build-args: |
            CICADA_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.HUB_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.HUB_IMAGE }}:latest
          # Image de release construite sans cache partagé (empoisonnement).
          no-cache: true
