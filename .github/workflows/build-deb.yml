# Build du package .deb au push d'un tag v* (même déclencheur que les images Docker).
# La version du .deb = version du tag (ex. v0.1.13 → cicada_0.1.13_amd64.deb).
name: Build Debian package

on:
  push:
    tags:
      - 'v*'

# Jeton du dépôt en lecture seule par défaut (un job qui doit écrire le
# déclare lui-même).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      # Le nom du tag n'est jamais inséré dans un script (variable
      # d'environnement), et refusé s'il n'est pas un numéro de version.
      - name: Extract version from tag
        id: version
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag invalide : $GITHUB_REF_NAME"; exit 1; }
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build .deb
        run: |
          cd packaging
          VERSION="$VERSION" \
          TRACKING_API_URL="${TRACKING_API_URL:-https://tracking.cicada.reserves-naturelles.org/api}" \
          HUB_URL="${HUB_URL:-https://hub.cicada.reserves-naturelles.org}" \
          ./build-deb.sh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TRACKING_API_URL: "https://tracking.cicada.reserves-naturelles.org/api"
          HUB_URL: "https://hub.cicada.reserves-naturelles.org"

      - name: Upload package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: cicada-deb-${{ steps.version.outputs.version }}
          path: packaging/build/cicada_${{ steps.version.outputs.version }}_amd64.deb
