name: SBOM

# Tag de version, comme docker-publish.yml et build-deb.yml : c'est lui qui marque
# ce qui part en production (les releases GitHub ne sont plus publiees depuis
# v0.1.39). Un push sur main remonterait des inventaires pour du code jamais deploye.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Jeton du dépôt en lecture seule par défaut (un job qui doit écrire le
# déclare lui-même).
permissions:
  contents: read

jobs:
  sbom:
    # Les secrets Dependency-Track ne servent qu'à un tag : lancé à la main
    # depuis une branche, un script modifié sur cette branche les lirait.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      # Memes versions que tests.yml : frontend (npm) et backend/hub/tracking-api (Python).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'

      - name: Générer et envoyer les SBOM
        run: ./scripts/generate-sbom.sh --envoi
        env:
          DT_URL: ${{ secrets.DT_URL }}
          DT_API_KEY: ${{ secrets.DT_API_KEY }}
          APP_VERSION: ${{ github.ref_name }}

      # Utile en cas de litige sur ce qui a ete envoye, et le seul moyen de
      # relire un SBOM sans rejouer le job.
      - name: Conserver les SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: sbom
          path: sbom/*.cdx.json
