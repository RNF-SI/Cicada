name: Tests

# Triggers réduits pour économiser les minutes GitHub Actions :
# - Les push sur main/develop sont déjà testés via la PR avant merge
# - Les tags v* lancent un retest avant la production release
# - Le manual dispatch permet de relancer en cas de besoin (tests email, etc.)
on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main, develop]
    # Skip si seuls les fichiers documentation / configuration éditoriale changent
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'KitUI/**'
      - '.gitignore'
      - 'LICENSE'
      - 'CHANGELOG.md'
  workflow_dispatch:
    # Permet de lancer le workflow manuellement depuis GitHub
    # Utile pour les tests d'intégration email

# Annule les runs précédents quand on pousse à nouveau sur la même PR/branche.
# Économise des minutes en évitant de tester des commits intermédiaires obsolètes.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # Backend Tests
  # ============================================
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_DB: test_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      DJANGO_SETTINGS_MODULE: config.settings.development
      SECRET_KEY: test-secret-key-for-ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev

      - name: Install Python dependencies
        working-directory: ./backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov factory-boy Faker

      - name: Run database migrations
        working-directory: ./backend
        run: python manage.py migrate --noinput

      - name: Run backend tests
        working-directory: ./backend
        run: |
          pytest tests/ \
            -m "not email_integration" \
            --cov=apps \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --junitxml=junit.xml \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: |
            ./backend/junit.xml
            ./backend/coverage.xml

  # ============================================
  # Email Integration Tests (Optional - Manual trigger)
  # ============================================
  # Ces tests envoient des emails via Mailpit pour vérifier les templates.
  # Ils sont exclus des tests automatiques et peuvent être lancés manuellement.
  email-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025

    env:
      POSTGRES_DB: test_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      DJANGO_SETTINGS_MODULE: config.settings.development
      SECRET_KEY: test-secret-key-for-ci
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: localhost
      EMAIL_PORT: 1025
      EMAIL_USE_TLS: 'false'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev

      - name: Install Python dependencies
        working-directory: ./backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django factory-boy Faker

      - name: Run database migrations
        working-directory: ./backend
        run: python manage.py migrate --noinput

      - name: Run email integration tests
        working-directory: ./backend
        run: |
          pytest tests/apps/notifications/test_email_integration.py \
            -m email_integration \
            -v

  # ============================================
  # Frontend Tests
  # ============================================
  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: ./frontend
        run: |
          npm run test:coverage -- \
            --ci \
            --reporters=default \
            --reporters=jest-junit
        env:
          JEST_JUNIT_OUTPUT_DIR: ./
          JEST_JUNIT_OUTPUT_NAME: junit.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-results
          path: |
            ./frontend/junit.xml
            ./frontend/coverage/

  # ============================================
  # TypeScript Type Check
  # ============================================
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: ./frontend
        run: npx tsc --noEmit

  # ============================================
  # E2E Tests (Playwright)
  # ============================================
  e2e-tests:
    runs-on: ubuntu-latest
    needs: [backend-tests]
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Start Docker services
        run: |
          docker compose up -d db redis web
          echo "Waiting for backend health check..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/api/auth/health/ > /dev/null 2>&1; then
              echo "Backend is ready!"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "Backend failed to start"
              docker compose logs web
              exit 1
            fi
            sleep 2
          done

      - name: Force import nomenclatures
        run: docker compose exec -T web python manage.py import_nomenclatures --force

      - name: Seed test data
        run: docker compose exec -T web python manage.py seed_testdata

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Start Angular dev server
        working-directory: ./frontend
        run: |
          npm start &
          echo "Waiting for frontend..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4200 > /dev/null 2>&1; then
              echo "Frontend is ready!"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "Frontend failed to start"
              exit 1
            fi
            sleep 2
          done

      - name: Run E2E tests
        working-directory: ./frontend
        run: npx playwright test --config=e2e/playwright.config.ts
        env:
          CI: true
          E2E_SEED_DATA: false

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            ./frontend/playwright-report/
            ./frontend/e2e-results.xml
          retention-days: 14

      - name: Stop Docker services
        if: always()
        run: docker compose down

  # ============================================
  # Build Check
  # ============================================
  build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, typecheck]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend for production
        working-directory: ./frontend
        run: npm run build:prod

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ./frontend/dist/
          retention-days: 7
