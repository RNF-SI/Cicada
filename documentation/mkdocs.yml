# Documentation CICADA — site statique MkDocs (Material).
# Construit par `mkdocs build` ; servi sous /aide/ par l'image frontend (voir frontend/Dockerfile).
site_name: Documentation CICADA
site_description: Notice d'utilisation, guide d'administration et référence de l'API de CICADA
site_author: RNF / FCEN
repo_url: https://github.com/RNF-SI/Cicada
repo_name: RNF-SI/Cicada
edit_uri: edit/develop/documentation/docs/
copyright: CICADA — RNF &amp; FCEN, programme LIFE Biodiv'France — licence GPL-3.0
docs_dir: docs
site_dir: site
# L'URL réelle dépend de l'instance (https://<instance>/aide/) : liens relatifs uniquement.
use_directory_urls: true
# strict est passé en ligne de commande (`mkdocs build --strict` dans l'image et en CI),
# pour que `mkdocs serve` reste utilisable pendant la rédaction.
validation:
  anchors: warn
  links:
    absolute_links: warn
    unrecognized_links: warn

theme:
  name: material
  language: fr
  logo: assets/images/logo-cicada-nb-2026.svg
  favicon: assets/images/logo-cicada-icon-2026.svg
  font:
    text: Nunito
    code: JetBrains Mono
  palette:
    scheme: cicada
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link
    - content.code.copy
  icon:
    repo: fontawesome/brands/github
    admonition:
      tip: material/lightbulb-outline
      note: material/information-outline
      warning: material/alert-outline

extra_css:
  - stylesheets/cicada.css

plugins:
  - search:
      lang: fr
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - swagger-ui-tag:
      docExpansion: list
      filter: true
      tryItOutEnabled: false
      # « Try it out » exécute de vraies requêtes depuis le navigateur. Servie sous
      # /aide/ sur la même origine que l'API de l'instance, la doc permettrait donc
      # d'écrire sur les données réelles : seules les lectures restent essayables.
      # Les essais complets se font sur /api/docs/ de l'instance (authentifié).
      supportedSubmitMethods:
        - get

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
      permalink_title: Lien vers cette section
      toc_depth: 3
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Accueil: index.md
  - Guide utilisateur:
      - utilisateur/index.md
      - Notice Utilisateur:
