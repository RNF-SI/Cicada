          - Le tableau de bord général d'une instance: admin-instance/tableau-de-bord.md
          - Gérer tous les utilisateurs et l'impersonation: admin-instance/utilisateurs.md
          - Gérer les rédacteurs généraux: admin-instance/redacteurs-generaux.md
          - Gérer les modules: admin-instance/modules.md
          - Consulter les journaux d'erreurs et du serveur: admin-instance/journaux.md
          - Traiter les demandes RGPD: admin-instance/rgpd.md
          - Paramètres de l'instance et mise à jour: admin-instance/parametres.md
  - Administration technique:
      - administration/index.md
  - API:
      - api/index.md
      - Prise en main: api/prise-en-main.md
      - Authentification et permissions: api/authentification.md
      - Domaines:
          - Authentification: api/auth.md
          - Utilisateurs: api/users.md
          - Organismes et sites: api/organismes-sites.md
          - Plans de gestion: api/plans.md
          - Arborescence: api/arborescence.md
          - Actions et suivi: api/actions-suivi.md
          - Référentiels: api/referentiels.md
          - Notifications, validations et activité: api/notifications.md
          - Exploration et fédération: api/exploration.md
          - Administration de l'instance: api/administration.md
