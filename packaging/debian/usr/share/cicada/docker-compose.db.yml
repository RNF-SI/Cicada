# CICADA - Option base de données intégrée (conteneur PostgreSQL/PostGIS)
# À utiliser avec : docker compose -f docker-compose.yml -f docker-compose.db.yml --env-file /var/lib/cicada/.env up -d

services:
  db:
    image: postgis/postgis:17-3.5-alpine
    container_name: cicada_prod_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=fr_FR.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /usr/share/cicada/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - cicada_network
    healthcheck:
      # $$ pour que le shell du conteneur développe $POSTGRES_USER / $POSTGRES_DB (pas Compose)
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 60s
    restart: unless-stopped

  web:
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

  celery-beat:
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
