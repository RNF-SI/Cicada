# CICADA - Exposition du port frontend (utilisé SANS Traefik)
# À utiliser avec : -f docker-compose.yml -f docker-compose.db.yml (si DB) -f docker-compose.frontend-ports.yml
# Ne pas utiliser avec docker-compose.traefik.yml (Traefik gère l'accès au frontend)

services:
  frontend:
    ports:
      # Apache / Nginx d entrée sur ce même serveur : FRONTEND_BIND=127.0.0.1 dans .env,
      # sinon le port contourne le proxy (et son TLS) depuis le réseau.
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-80}:80"
