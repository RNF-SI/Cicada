# CICADA - Installation via package .deb (sans base intégrée)
# Utilise uniquement les images pré-buildées (GHCR).
# Avec base existante : docker compose --env-file /var/lib/cicada/.env up -d
# Avec base intégrée  : docker compose -f docker-compose.yml -f docker-compose.db.yml --env-file /var/lib/cicada/.env up -d

services:
  # Cache Redis
  redis:
    image: redis:7-alpine
    container_name: cicada_prod_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    networks:
      - cicada_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Backend Django (image pré-buildée GHCR)
  web:
    image: ghcr.io/rnf-si/cicada-backend:${CICADA_VERSION:-latest}
    container_name: cicada_prod_web
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - EMAIL_BACKEND=${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-true}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-noreply@cicada.fr}
      - SITE_URL=${SITE_URL:-http://localhost:4200}
    volumes:
      - media_files:/app/media
      - static_files:/app/static
      # #384 — bind-mount des logs sur l'hôte (/var/log/cicada) pour qu'ils
      # soient consultables directement sur le serveur (le conteneur écrit dans
      # /app/logs ; le dossier hôte est créé par le postinst, conteneur=root).
      - /var/log/cicada:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cicada_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 180s
    restart: unless-stopped

  # Frontend Angular (image pré-buildée GHCR)
  # Ports exposés via docker-compose.frontend-ports.yml (sauf si Traefik activé)
  frontend:
    image: ghcr.io/rnf-si/cicada-frontend:${CICADA_VERSION:-latest}
    container_name: cicada_prod_frontend
    depends_on:
      web:
        condition: service_healthy
    networks:
      - cicada_network
    restart: unless-stopped

  # Celery Worker
  celery-worker:
    image: ghcr.io/rnf-si/cicada-backend:${CICADA_VERSION:-latest}
    container_name: cicada_prod_celery_worker
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - EMAIL_BACKEND=${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-true}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-noreply@cicada.fr}
      - SITE_URL=${SITE_URL:-http://localhost:4200}
    volumes:
      - media_files:/app/media
      # #384 — bind-mount des logs sur l'hôte (/var/log/cicada) pour qu'ils
      # soient consultables directement sur le serveur (le conteneur écrit dans
      # /app/logs ; le dossier hôte est créé par le postinst, conteneur=root).
      - /var/log/cicada:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - cicada_network
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    restart: unless-stopped

  # Celery Beat
  celery-beat:
    image: ghcr.io/rnf-si/cicada-backend:${CICADA_VERSION:-latest}
    container_name: cicada_prod_celery_beat
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
      - DJANGO_SETTINGS_MODULE=config.settings.production
    volumes:
      # #384 — bind-mount des logs sur l'hôte (/var/log/cicada) pour qu'ils
      # soient consultables directement sur le serveur (le conteneur écrit dans
      # /app/logs ; le dossier hôte est créé par le postinst, conteneur=root).
      - /var/log/cicada:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - cicada_network
    command: ["celery", "-A", "config", "beat", "-l", "info"]
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  media_files:
    driver: local
  static_files:
    driver: local
  logs_data:
    driver: local

networks:
  cicada_network:
    name: cicada_network
    driver: bridge
