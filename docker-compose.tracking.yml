# API de suivi (TrackingCicada) en local — banc de l'adhésion au hub (#696).
#
# En production, l'API de suivi tourne chez RNF et reçoit le heartbeat de
# toutes les instances. Ce compose en lance une copie jetable pour tester le
# circuit complet sur un poste : demande d'adhésion depuis une instance de dev,
# envoi du code de confirmation depuis l'admin du suivi, saisie du code sur
# l'instance, enrôlement sur le hub local. Les e-mails (à RNF, au demandeur, le
# code) sont capturés par Mailpit : http://localhost:8027.
#
# Ne pas lancer à la main : « scripts/federation.sh adhesion up » s'occupe du
# jeton d'administration partagé avec le hub et de l'enregistrement du poste.
#
# Nom de projet figé, pour la même raison que le hub : sans lui, Compose le
# déduirait du dossier et le service `db` viserait la base de l'instance
# principale.
name: cicada_tracking

services:
  db:
    image: postgres:17-alpine
    container_name: cicada_tracking_db
    environment:
      POSTGRES_DB: tracking
      POSTGRES_USER: tracking_user
      POSTGRES_PASSWORD: tracking_password
    volumes:
      - tracking_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracking_user -d tracking"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    image: python:3.12-slim
    container_name: cicada_tracking_api
    working_dir: /app
    environment:
      - SECRET_KEY=${SECRET_KEY:-tracking-dev-secret}
      - DEBUG=True
      # host.docker.internal : c'est par ce nom que l'instance de dev l'appelle.
      - ALLOWED_HOSTS=localhost,127.0.0.1,host.docker.internal
      - DB_NAME=tracking
      - DB_USER=tracking_user
      - DB_PASSWORD=tracking_password
      - DB_HOST=db
      - DB_PORT=5432
      - HUB_URL=${HUB_URL:-http://host.docker.internal:8002}
      - HUB_ADMIN_TOKEN=${HUB_ADMIN_TOKEN:-}
      # E-mails de l'adhésion capturés par le Mailpit du banc (rien ne sort).
      - EMAIL_HOST=mailpit
      - EMAIL_PORT=1025
      - EMAIL_USE_TLS=False
      - RNF_CONTACT_EMAIL=si@rnfrance.org
      - ADMIN_BASE_URL=http://localhost:${TRACKING_PORT:-8010}
      - DJANGO_SUPERUSER_USERNAME=admin
      - DJANGO_SUPERUSER_EMAIL=admin@test.fr
      - DJANGO_SUPERUSER_PASSWORD=admin
    volumes:
      - ./tracking-api:/app
      - tracking_pip_cache:/root/.cache/pip
    command: >
      sh -c "pip install -q -r requirements.txt &&
             python manage.py migrate --noinput &&
             (python manage.py createsuperuser --noinput 2>/dev/null || true) &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "${TRACKING_PORT:-8010}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  # Distinct du Mailpit de l'instance (:8025) : ici, ce que RNF et les
  # structures recevraient de l'API de suivi.
  mailpit:
    image: axllent/mailpit
    container_name: cicada_tracking_mailpit
    ports:
      - "${TRACKING_MAILPIT_PORT:-8027}:8025"
    restart: unless-stopped

volumes:
  tracking_postgres_data:
  tracking_pip_cache:
