<header class="header" [class.home-page]="isHomePage()">
  <div class="header-content">
    <!-- Hamburger Menu - Hidden on home page -->
    @if (!isHomePage()) {
      <button class="hamburger-btn" (click)="toggleMenu()" aria-label="Menu">
        <i class="fi fi-rr-menu-burger"></i>
      </button>
    }

    <!-- Logo centered -->
    <a routerLink="/" class="header-logo">
      <img src="assets/images/logo-biodiv-france.svg" alt="Biodiv' France" class="logo-img" />
    </a>

    <!-- Navigation -->
    <nav class="header-nav">
      @if (isAuthenticated()) {
        <!-- Administration button - opens in new window -->
        @if (canAccessAdmin()) {
          <a (click)="openAdminInNewWindow()" class="nav-link admin-btn" role="button" tabindex="0">
            <i class="fi fi-rr-settings-sliders"></i>
            <span class="btn-text">Administration</span>
          </a>
        }

        <!-- User menu -->
        <button mat-button [matMenuTriggerFor]="userMenu" class="nav-link user-menu-trigger">
          <i class="fi fi-rr-user user-icon"></i>
          <span class="user-name">Mon compte</span>
          <i class="fi fi-rr-angle-small-down chevron"></i>
        </button>

        <mat-menu #userMenu="matMenu" class="user-dropdown-menu">
          <div class="menu-user-info">
            <span class="menu-user-name">{{ userDisplayName }}</span>
            <span class="menu-user-email">{{ currentUser()?.email }}</span>
          </div>
          <mat-divider></mat-divider>
          <button mat-menu-item routerLink="/profile">
            <i class="fi fi-rr-user menu-icon"></i>
            <span>Mon profil</span>
          </button>
          <button mat-menu-item routerLink="/settings">
            <i class="fi fi-rr-settings menu-icon"></i>
            <span>Parametres</span>
          </button>
          <mat-divider></mat-divider>
          <button mat-menu-item (click)="logout()" class="logout-item">
            <i class="fi fi-rr-sign-out-alt menu-icon"></i>
            <span>Deconnexion</span>
          </button>
        </mat-menu>
      } @else {
        <!-- Guest user - Login button -->
        <a routerLink="/auth/login" class="nav-link user-menu-trigger">
          <i class="fi fi-rr-user user-icon"></i>
          <span class="user-name">Mon compte</span>
          <i class="fi fi-rr-angle-small-down chevron"></i>
        </a>
      }
    </nav>
  </div>
</header>

<!-- Mobile Menu Overlay -->
@if (menuOpen) {
  <div class="menu-overlay" (click)="toggleMenu()"></div>
  <nav class="mobile-menu">
    <div class="mobile-menu-header">
      <span class="mobile-menu-title">Menu</span>
      <button class="close-btn" (click)="toggleMenu()">
        <i class="fi fi-rr-cross"></i>
      </button>
    </div>
    <div class="mobile-menu-content">
      <a routerLink="/accueil" class="mobile-menu-item" (click)="toggleMenu()">
        <i class="fi fi-rr-home"></i>
        <span>Accueil</span>
      </a>
      <a routerLink="/plans" class="mobile-menu-item" (click)="toggleMenu()">
        <i class="fi fi-rr-document"></i>
        <span>Plans de gestion</span>
      </a>
      @if (isAuthenticated() && canAccessAdmin()) {
        <a (click)="openAdminInNewWindow(); toggleMenu()" class="mobile-menu-item" role="button" tabindex="0">
          <i class="fi fi-rr-settings-sliders"></i>
          <span>Administration</span>
        </a>
      }
    </div>
  </nav>
}
