<header class="header">
  <div class="header-content">
    <!-- Logo -->
    <a routerLink="/" class="header-logo">
      <svg class="logo-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="18" fill="#025359"/>
        <path d="M20 8C16 8 12 12 12 16C12 20 16 24 20 28C24 24 28 20 28 16C28 12 24 8 20 8Z" fill="#FEC180"/>
        <circle cx="20" cy="16" r="3" fill="#025359"/>
      </svg>
      <span class="logo-text">
        <span class="logo-biodiv">BIODIV'</span>
        <span class="logo-france">FRANCE</span>
      </span>
    </a>

    <!-- Navigation -->
    <nav class="header-nav">
      <a routerLink="/administration" class="nav-link">
        <i class="fi fi-rr-settings-sliders"></i>
        <span>Administration</span>
      </a>

      <button mat-button [matMenuTriggerFor]="userMenu" class="nav-link user-menu-trigger">
        <i class="fi fi-rr-user"></i>
        <span>Mon compte</span>
        <i class="fi fi-rr-angle-small-down chevron"></i>
      </button>

      <mat-menu #userMenu="matMenu">
        <button mat-menu-item routerLink="/profile">
          <i class="fi fi-rr-user menu-icon"></i>
          <span>Mon profil</span>
        </button>
        <button mat-menu-item routerLink="/settings">
          <i class="fi fi-rr-settings menu-icon"></i>
          <span>Paramètres</span>
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="logout()">
          <i class="fi fi-rr-sign-out-alt menu-icon"></i>
          <span>Déconnexion</span>
        </button>
      </mat-menu>
    </nav>
  </div>
</header>
