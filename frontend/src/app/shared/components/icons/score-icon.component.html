<svg
  [attr.width]="size"
  [attr.height]="size"
  viewBox="0 0 20 20"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  [class]="'score-icon score-icon--' + level"
  role="img"
  [attr.aria-label]="getLabel()"
>
  <!-- Circle background -->
  <circle cx="10" cy="10" r="10" [attr.fill]="getBackgroundColor()"/>

  <!-- Eyes -->
  <circle cx="6.5" cy="8" r="1.2" [attr.fill]="getElementColor()"/>
  <circle cx="13.5" cy="8" r="1.2" [attr.fill]="getElementColor()"/>

  <!-- Mouth based on score level -->
  @switch (level) {
    @case ('very-bad') {
      <!-- Very sad mouth (deep frown) -->
      <path
        d="M5 15 Q10 11 15 15"
        stroke-width="1.5"
        stroke-linecap="round"
        fill="none"
        [attr.stroke]="getElementColor()"
      />
    }
    @case ('bad') {
      <!-- Sad mouth (slight frown) -->
      <path
        d="M6 14 Q10 12 14 14"
        stroke-width="1.5"
        stroke-linecap="round"
        fill="none"
        [attr.stroke]="getElementColor()"
      />
    }
    @case ('neutral') {
      <!-- Neutral mouth (straight line) -->
      <line
        x1="6" y1="13" x2="14" y2="13"
        stroke-width="1.5"
        stroke-linecap="round"
        [attr.stroke]="getElementColor()"
      />
    }
    @case ('good') {
      <!-- Happy mouth (slight smile) -->
      <path
        d="M6 12 Q10 14 14 12"
        stroke-width="1.5"
        stroke-linecap="round"
        fill="none"
        [attr.stroke]="getElementColor()"
      />
    }
    @case ('very-good') {
      <!-- Very happy mouth (big smile) -->
      <path
        d="M5 11 Q10 16 15 11"
        stroke-width="1.5"
        stroke-linecap="round"
        fill="none"
        [attr.stroke]="getElementColor()"
      />
    }
    @case ('no-data') {
      <!-- Question mark mouth -->
      <text
        x="10" y="15"
        text-anchor="middle"
        font-size="6"
        font-weight="bold"
        [attr.fill]="getElementColor()"
      >?</text>
    }
  }
</svg>
