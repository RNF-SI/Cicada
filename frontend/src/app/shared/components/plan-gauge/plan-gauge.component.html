<div class="gauge" [ngClass]="['gauge-' + status, 'theme-' + colorTheme()]">
  <div class="gauge-body">
    <!-- Track (pill outlined) -->
    <div class="gauge-track">
      <!-- Fill (barre de progression) -->
      <div class="gauge-fill" [style.width.%]="fillPercentage()"></div>
    </div>

    <!-- Midpoint marker (trait vertical à 50%) -->
    @if (showMidpointMarker()) {
      <div class="gauge-midpoint"></div>
    }

    <!-- Pointer (triangle pointant vers le bas) -->
    <div class="gauge-pointer" [style.left.%]="pointerPosition()">
      <svg width="9" height="7" viewBox="0 0 9 7" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="4.5,7 0,0 9,0" class="pointer-fill"/>
      </svg>
    </div>
  </div>

  <!-- Overflow dots pour "exceeded" : petits cercles après la barre -->
  @if (status === 'exceeded') {
    <div class="gauge-overflow">
      <div class="overflow-dash"></div>
      <svg width="3" height="3" viewBox="0 0 3 3" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="1.5" cy="1.5" r="1.5" class="overflow-fill"/>
      </svg>
      <svg width="3" height="3" viewBox="0 0 3 3" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="1.5" cy="1.5" r="1.5" class="overflow-fill"/>
      </svg>
    </div>
  }
</div>
