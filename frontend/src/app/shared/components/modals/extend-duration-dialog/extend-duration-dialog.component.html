<h2 mat-dialog-title>{{ 'plans.lifecycle.extendDuration.title' | translate }}</h2>

<mat-dialog-content>
  <p class="intro">
    {{ 'plans.lifecycle.extendDuration.intro' | translate:{ name: data.planName, year: data.anneeFin } }}
  </p>

  <div class="choice-grid">
    <button type="button" class="choice-card" (click)="choose(1)">
      <span class="choice-years">+1 an</span>
      <span class="choice-new-end">
        {{ 'plans.lifecycle.extendDuration.newEnd' | translate }} : <strong>{{ data.anneeFin + 1 }}</strong>
      </span>
    </button>
    <button type="button" class="choice-card" (click)="choose(2)">
      <span class="choice-years">+2 ans</span>
      <span class="choice-new-end">
        {{ 'plans.lifecycle.extendDuration.newEnd' | translate }} : <strong>{{ data.anneeFin + 2 }}</strong>
      </span>
    </button>
  </div>

  <p class="hint">
    {{ 'plans.lifecycle.extendDuration.hint' | translate }}
  </p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button (click)="cancel()">
    {{ 'common.actions.cancel' | translate }}
  </button>
</mat-dialog-actions>
