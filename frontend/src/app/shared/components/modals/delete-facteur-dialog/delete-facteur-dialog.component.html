<h2 mat-dialog-title>{{ 'enjeux.facteurInfluence.deleteDialog.title' | translate }}</h2>

<mat-dialog-content>
  <p class="dialog-subtitle">
    {{ 'enjeux.facteurInfluence.deleteDialog.subtitle' | translate:{ libelle: data.libelle, count: data.nbEnjeux } }}
  </p>

  <div class="choice-list">
    <!-- Retirer le facteur de cet enjeu seulement (option non destructive) -->
    <button type="button" class="choice-card" data-testid="facteur-unlink-choice"
            [class.selected]="mode() === 'unlink'"
            (click)="setMode('unlink')">
      <div class="choice-radio">
        <span class="radio-dot" [class.active]="mode() === 'unlink'"></span>
      </div>
      <div class="choice-content">
        <span class="choice-label">{{ 'enjeux.facteurInfluence.deleteDialog.unlinkLabel' | translate:{ enjeu: data.enjeuLibelle } }}</span>
        <span class="choice-description">{{ 'enjeux.facteurInfluence.deleteDialog.unlinkDescription' | translate }}</span>
      </div>
    </button>

    <!-- Supprimer le facteur de tous les enjeux (option destructive) -->
    <button type="button" class="choice-card choice-destructive" data-testid="facteur-delete-choice"
            [class.selected]="mode() === 'delete'"
            (click)="setMode('delete')">
      <div class="choice-radio">
        <span class="radio-dot" [class.active]="mode() === 'delete'"></span>
      </div>
      <div class="choice-content">
        <span class="choice-label">{{ 'enjeux.facteurInfluence.deleteDialog.deleteLabel' | translate:{ count: data.nbEnjeux } }}</span>
        <span class="choice-description">{{ 'enjeux.facteurInfluence.deleteDialog.deleteDescription' | translate }}</span>
      </div>
    </button>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button (click)="cancel()">
    {{ 'common.actions.cancel' | translate }}
  </button>
  @if (mode() === 'delete') {
    <button mat-flat-button color="warn" data-testid="facteur-delete-confirm" (click)="confirm()">
      {{ 'enjeux.facteurInfluence.deleteDialog.confirmDelete' | translate }}
    </button>
  } @else {
    <button mat-flat-button color="primary" data-testid="facteur-delete-confirm" (click)="confirm()">
      {{ 'enjeux.facteurInfluence.deleteDialog.confirmUnlink' | translate }}
    </button>
  }
</mat-dialog-actions>
