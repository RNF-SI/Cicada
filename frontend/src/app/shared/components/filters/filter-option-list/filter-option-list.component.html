@if (searchable()) {
  <div class="option-search">
    <i class="fi fi-rr-search option-search__icon" aria-hidden="true"></i>
    <input
      type="text"
      class="option-search__input"
      [value]="query()"
      [placeholder]="searchPlaceholder() || ('common.filters.search' | translate)"
      [attr.aria-label]="searchPlaceholder() || ('common.filters.search' | translate)"
      [attr.data-testid]="testId() ? testId() + '-search' : null"
      (input)="onSearchInput($event)"
    />
    @if (query()) {
      <button
        type="button"
        class="option-search__clear"
        [attr.aria-label]="'common.actions.clear' | translate"
        (click)="clearSearch()">
        <i class="fi fi-rr-cross-circle" aria-hidden="true"></i>
      </button>
    }
  </div>
}

@if (masterLabel(); as master) {
  <div class="option-master">
    <app-checkbox
      size="md"
      [theme]="theme()"
      [label]="master"
      [checked]="masterState() === 'checked'"
      [indeterminate]="masterState() === 'indeterminate'"
      (checkedChange)="toggleMaster()"
    />
  </div>
}

<!--
  La case à cocher est purement décorative (`aria-hidden`) : l'état sélectionné est porté
  par `aria-selected` sur l'option. Cela évite un contrôle interactif imbriqué dans un
  `role="option"` — et le double déclenchement qui allait avec.

  La ligne « tout » reste rendue même quand la recherche ne donne rien : c'est une commande
  de remise à zéro, pas un résultat de recherche.
-->
<ul class="option-list" role="listbox" [attr.aria-multiselectable]="multiple()">
  @if (allLabel(); as all) {
    <li class="option-item">
      <button
        type="button"
        role="option"
        class="option-row option-row--all"
        [class.option-row--selected]="selected().length === 0"
        [attr.aria-selected]="selected().length === 0"
        [attr.data-testid]="testId() ? testId() + '-option-all' : null"
        (click)="selectAllNone()">
        <span class="option-row__label"><em>{{ all }}</em></span>
      </button>
    </li>
  }

  @for (option of visible(); track option.value) {
      <li class="option-item">
        <button
          type="button"
          role="option"
          class="option-row"
          [class.option-row--selected]="isSelected(option.value)"
          [disabled]="option.disabled"
          [attr.aria-selected]="isSelected(option.value)"
          [attr.data-testid]="optionTestId(option)"
          (click)="toggle(option)">

          @if (multiple()) {
            <span class="option-row__check" aria-hidden="true">
              <app-checkbox
                size="md"
                [theme]="theme()"
                [checked]="isSelected(option.value)"
                [disabled]="!!option.disabled"
              />
            </span>
          }

          <span class="option-row__label">
            @for (seg of option.label | highlightMatch: query(); track $index) {
              @if (seg.match) {<strong>{{ seg.text }}</strong>} @else {{{ seg.text }}}
            }
            @if (option.count !== undefined) {
              <span class="option-row__count">({{ option.count }})</span>
            }
          </span>
        </button>
    </li>
  }
</ul>

@if (isEmpty()) {
  <p class="option-empty">{{ emptyLabel() || ('common.filters.noResults' | translate) }}</p>
}

@if (hiddenCount() > 0) {
  <button type="button" class="option-more" (click)="expanded.set(true)">
    {{ 'common.filters.showMore' | translate }}
  </button>
}
